name: Moodle plugin CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: "8.1", moodle-branch: MOODLE_401_STABLE }
          - { php: "8.3", moodle-branch: MOODLE_405_STABLE }
          - { php: "8.3", moodle-branch: MOODLE_500_STABLE }
          - { php: "8.3", moodle-branch: MOODLE_501_STABLE }
          - { php: "8.4", moodle-branch: MOODLE_503_STABLE }
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          coverage: none
      - name: Install oxidocs
        run: |
          curl -fsSLo oxidocs.tar.gz https://github.com/Ryujiyasu/oxi/releases/download/oxidocs-v0.9.0-static.7/oxidocs-x86_64-unknown-linux-musl.tar.gz
          echo "59f537d81108336dad089eeabc5d15214ba76d0eaa888fdf004764e98640b042  oxidocs.tar.gz" | sha256sum -c -
          tar -xzf oxidocs.tar.gz
          sudo install -m 755 oxidocs-x86_64-unknown-linux-musl/oxidocs /usr/local/bin/oxidocs
          oxidocs --version
      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(cd ci/bin; pwd)" >> "$GITHUB_PATH"
          echo "$(cd ci/vendor/bin; pwd)" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
      - name: Install Moodle and the plugin
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
      - run: moodle-plugin-ci phplint
      - run: moodle-plugin-ci phpcs --max-warnings 0
      - run: moodle-plugin-ci phpdoc --max-warnings 0
      - run: moodle-plugin-ci validate
      - run: moodle-plugin-ci savepoints
      - run: moodle-plugin-ci phpunit --fail-on-warning
        env:
          OXIDOCS_PATH: /usr/local/bin/oxidocs
